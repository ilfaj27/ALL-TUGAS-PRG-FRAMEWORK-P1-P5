<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Transaksi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background-color: #f8f9fa;
            font-family: "Tahoma", sans-serif;
            padding: 20px;
        }

        .container {
            margin-top: 30px;
        }

        .table-container {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .table thead th {
            background-color: #343a40;
            color: white;
        }

        .form-container {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: white;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="table-container">
            <h1>Daftar Transaksi - P7_067</h1>

            <button id="addDataBtn" class="btn btn-primary mb-3">+ Add Data</button>

            <table id="transaction-table" class="table table-bordered">
                <thead>
                    <tr>
                        <th>ID Transaksi</th>
                        <th>Tanggal</th>
                        <th>ID Produk</th>
                        <th>Jumlah</th>
                        <th>Total Harga</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td colspan="7" class="text-center">
                            Data transaksi akan muncul di sini...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="container">
        <div class="form-container" id="formContainer">
            <h3 id="formTitle">Tambah Transaksi Baru</h3>

            <form id="transactionForm">
                <div class="mb-3">
                    <label for="idProduk" class="form-label"> ID Produk </label>

                    <input type="number" class="form-control" id="idProduk" required />
                </div>

                <div class="mb-3">
                    <label for="jumlah" class="form-label"> Jumlah </label>

                    <input type="number" class="form-control" id="jumlah" required />
                </div>

                <button type="submit" class="btn btn-success" id="submitBtn">
                    Submit
                </button>

                <button type="button" id="cancelBtn" class="btn btn-secondary">
                    Cancel
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const url = "https://api.melangkah.my.id/produk/read.php";

        const createUrl = "https://api.melangkah.my.id/produk/create.php";

        const updateUrl = "https://api.melangkah.my.id/produk/update.php";

        async function getTransactions() {
            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const transactions = await response.json();

                const tableBody = document.querySelector("#transaction-table tbody");

                tableBody.innerHTML = "";

                transactions.forEach((transaction) => {
                    const row = `
                        <tr>
                            <td>${transaction.id_transaksi}</td>
                            <td>${transaction.tanggal_transaksi}</td>
                            <td>${transaction.id_produk}</td>
                            <td>${transaction.jumlah}</td>
                            <td>${transaction.total_harga}</td>
                            <td>${transaction.status_transaksi}</td>
                            <td>
                                <button
                                    class="btn btn-warning btn-sm"
                                    onclick="editTransaction(${transaction.id_transaksi})">
                                    Edit
                                </button>
                            </td>
                        </tr>
                    `;

                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Gagal mengambil data transaksi:", error);

                document.querySelector("#transaction-table tbody").innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center">
                            Tidak dapat mengambil data transaksi.
                        </td>
                    </tr>
                `;
            }
        }

        document
            .getElementById("addDataBtn")
            .addEventListener("click", function () {
                document.getElementById("formTitle").textContent =
                    "Tambah Transaksi Baru";

                document.getElementById("submitBtn").textContent = "Submit";

                document.getElementById("transactionForm").reset();

                document.getElementById("transactionForm").removeAttribute("data-id");

                document.getElementById("formContainer").style.display = "block";
            });

        document
            .getElementById("cancelBtn")
            .addEventListener("click", function () {
                document.getElementById("formContainer").style.display = "none";
            });

        document
            .getElementById("transactionForm")
            .addEventListener("submit", async function (e) {
                e.preventDefault();

                const id = this.dataset.id;

                const idProduk = document.getElementById("idProduk").value;

                const jumlah = document.getElementById("jumlah").value;

                const transactionData = {
                    id_produk: idProduk,
                    jumlah: jumlah,
                };

                try {
                    if (id) {
                        transactionData.id_transaksi = id;

                        const response = await fetch(updateUrl, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify(transactionData),
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        alert("Transaksi berhasil diperbarui!");
                    } else {
                        const response = await fetch(createUrl, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify(transactionData),
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        alert("Transaksi berhasil ditambahkan!");
                    }

                    getTransactions();

                    document.getElementById("formContainer").style.display = "none";
                } catch (error) {
                    console.error("Gagal mengirim data transaksi:", error);

                    alert("Gagal mengirim data transaksi.");
                }
            });

        async function editTransaction(id) {
            try {
                const detailUrl = `https://api.melangkah.my.id/produk/detail.php?id=${id}`;

                const response = await fetch(detailUrl);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const transaction = await response.json();

                if (!transaction) {
                    throw new Error("Data transaksi tidak ditemukan");
                }

                document.getElementById("idProduk").value = transaction.id_produk;

                document.getElementById("jumlah").value = transaction.jumlah;

                document.getElementById("formTitle").textContent =
                    "Update Data Transaksi";

                document.getElementById("submitBtn").textContent = "Update";

                document.getElementById("transactionForm").dataset.id =
                    transaction.id_transaksi;

                document.getElementById("formContainer").style.display = "block";
            } catch (error) {
                console.error("Gagal mengambil data transaksi:", error);

                alert(
                    "Terjadi kesalahan saat mengambil data transaksi, silakan coba lagi.",
                );
            }
        }

        getTransactions();
    </script>
</body>

</html>
