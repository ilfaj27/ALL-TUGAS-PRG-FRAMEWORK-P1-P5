<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
</head>
<body>

    <h1>Aplikasi Penghitung Jumlah Klik</h1>

    <button onclick="hitungKlik()">Klik Saya</button>

    <p>Jumlah Klik: <span id="jumlahKlik">0</span></p>

    <script>
        let jumlahKlik = 0;

        function hitungKlik() {
            jumlahKlik++;

            document.getElementById("jumlahKlik").textContent = jumlahKlik;
        }
    </script>
</body>
</html>
